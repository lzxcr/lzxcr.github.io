name: Code quality

on:
  push:
    branches: [ master ] # Adjust branches as needed
  pull_request:
    branches: [ master ] # Adjust branches as needed

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 使用项目锁定的 Biome（devDependencies 内的 @biomejs/biome），
      # 而非 biomejs/setup-biome 的 version: latest —— 后者会随上游发布漂移，
      # 导致同一份代码在 CI 与本地 pnpm lint 得到不同结果。
      - name: Run Biome
        run: pnpm exec biome ci ./src ./scripts --reporter=github
